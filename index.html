<title>Three Crowns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--bar:#fff;--ink:#16202a;--line:#c9d1d8;--acc:#16202a;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#18222b;--ink:#e6edf2;--line:#2b3946;--acc:#e6edf2;--accink:#0f161c}}
:root[data-theme="dark"]{--bar:#18222b;--ink:#e6edf2;--line:#2b3946;--acc:#e6edf2;--accink:#0f161c}
*{touch-action:manipulation}
html,body{height:100%;margin:0}
body{position:relative;background:var(--bar);color:var(--ink);font:500 17px "Barlow Condensed",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{flex:1;min-height:0;position:relative;background:#14202a}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{display:flex;gap:6px;padding:8px 10px;background:var(--bar);border-top:1px solid var(--line);overflow-x:auto;align-items:center}
button{font:inherit;font-size:17px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;white-space:nowrap;flex:none}
button.on,button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:disabled{opacity:.4}
.sp{flex:1}
.chip{display:flex;align-items:center;padding:0 8px;font-weight:700;flex:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px}
#msg{position:absolute;left:12px;top:10px;right:230px;color:#e6edf2;opacity:.8;font-size:15px;pointer-events:none;text-shadow:0 1px 2px #000}
#card{position:absolute;left:10px;top:46px;display:flex;gap:10px;padding:10px 12px;background:rgba(14,22,30,.9);color:#e6edf2;border-radius:8px;font-size:15px;line-height:1.3}
#win{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,16,22,.75);color:#fff}
#win div{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:32px;font-weight:700}
#card[hidden],#win[hidden],#menu[hidden]{display:none}
#menu{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;background:radial-gradient(ellipse at 50% 40%,rgba(8,14,20,.35),rgba(6,10,15,.82));color:#e6edf2;overflow:auto}
#menu>:first-child{margin-top:auto}#menu>:last-child{margin-bottom:auto}
#menu h1{font-size:46px;margin:0 0 12px;font-weight:800;letter-spacing:1px;text-shadow:0 2px 24px rgba(0,0,0,.7),0 0 30px rgba(224,180,34,.35)}
#mbg{position:absolute;inset:-6%;width:112%;height:112%;z-index:4;object-fit:cover;animation:drift 16s ease-in-out infinite alternate;will-change:transform;filter:saturate(1.15) brightness(.9)}
#menu[hidden]~#mbg{display:none}
@keyframes drift{from{transform:translate3d(-12%,0,0) scale(1.3)}to{transform:translate3d(12%,0,0) scale(1.3)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#menu>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#menu>*:nth-child(2){animation-delay:.04s}#menu>*:nth-child(3){animation-delay:.08s}#menu>*:nth-child(4){animation-delay:.12s}#menu>*:nth-child(5){animation-delay:.16s}#menu>*:nth-child(6){animation-delay:.2s}#menu>*:nth-child(7){animation-delay:.24s}#menu>*:nth-child(n+8){animation-delay:.28s}
button{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .18s,color .18s,border-color .18s,box-shadow .2s,opacity .18s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.95)}
@media(hover:hover){button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}button:active:not(:disabled){transform:scale(.96)}}
#menu button{background:rgba(16,26,34,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px}
#menu button.pri{box-shadow:0 0 0 0 rgba(224,180,34,.5);animation:glow 2.6s ease-in-out infinite}

 else if(k==='lm'){if(b===me){t=NAME[a]+' captured '+x+' from you!';bad=1}else t=nm_(a)+' captured '+x}
 else if(k==='rg')t=nm_(a)+' founded '+x;
 else if(k==='rgl'){t=nm_(a)+(a===me?' lost ':' lost ')+x;bad=a===me?1:0}
 else if(k==='def')t=nm_(a)+' rallied to defend against '+NAME[b];

 else if(k==='brk'){if(x==='collapse')t='The alliance of '+NAME[a]+' and '+NAME[b]+' collapsed';else if(b===me){t=NAME[a]+' is ending the treaty with you!';bad=1}else t=nm_(a)+' broke the treaty with '+NAME[b]}
 else if(k==='cfend')t='The ceasefire between '+NAME[a]+' and '+NAME[b]+' ended';
 else if(k==='collapse')t='Only one crown can remain: '+NAME[a]+' and '+NAME[b]+' split in 45s';
 else if(k==='uni')t=nm_(b)+' joined '+(a===me?'your union':'the union of '+NAME[a])+' ('+x+')';
 else if(k==='mrg')t=nm_(a)+' and '+nm_(b)+' merged to form '+x;
 else if(k==='sec'){t=nm_(a)+' broke away from '+(b===me?'your union':'the union of '+NAME[b])+'!';if(b===me)bad=1}

function move(x,y){
 const l=loc(x,y);ptr={x:l[2],y:l[3]};
 if(mode==='edit'){if(painting){const tx=Math.floor(l[0]),ty=Math.floor(l[1]),n=Math.max(Math.abs(tx-paintLast[0]),Math.abs(ty-paintLast[1]));
  for(let k=1;k<=n;k++){const a=Math.round(paintLast[0]+(tx-paintLast[0])*k/n),b=Math.round(paintLast[1]+(ty-paintLast[1])*k/n);if(inb(a,b))paint(a,b,true)}paintLast=[tx,ty]}return}
 if(tap&&Math.hypot(l[2]-tap.x,l[3]-tap.y)>8)tap.moved=true;

function up(){
 if(mode==='edit'){painting=false;return}
 if(aaDrag){aaDrag=false;placeAA();return}
 if(drag){const d=drag;drag=null;
  if(d.rg){if(d.moved)finishRegion(d);else if(tap)tapRegion(tap.i);ui();hint();tap=null;return}
  if(d.moved&&d.pl&&d.pl.tiles.length){pend=d.pl;pend.pts=d.pts;pendAt=ptr&&{x:ptr.x,y:ptr.y}}
  else if(!d.moved){const c=tap&&capAt(tap.i);if(c)showCard(c);else if(tap&&!poiTap(tap.i))tapRegion(tap.i)}
  ui();hint()}
 else if(tap&&!tap.moved){const c=capAt(tap.i);if(c)showCard(c);else poiTap(tap.i)}

const P_=e=>{const s=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return[s.clientX,s.clientY]},on=(ev,fn,o)=>cv.addEventListener(ev,fn,o);

  if(ptrs.size===2){painting=false;aaDrag=false;drag=null;tap=null;pan=null;ign=true;pinchInit();return}
  if(ptrs.size>2||ign)return;
  if(panMode||e.button===1||e.button===2){pan={x:q[0],y:q[1],ox,oy};return}
  down(q[0],q[1])});

  if(ign)return;move(q[0],q[1])});

else{on('mousedown',e=>down(...P_(e)));on('mousemove',e=>move(...P_(e)));on('mouseup',up);

on('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0016))},{passive:false});
on('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());

function clampCam(){
 const r=cv.parentNode.getBoundingClientRect(),rw=r.width,rh=r.height,t0=T0||1;
 zm=Math.max(1,Math.min(zm,Math.max(1,48/t0)));T=t0*zm;
 const f=(c,world,sz)=>world*T<=sz?(sz-world*T)/2:Math.min(40,Math.max(sz-world*T-40,c));
 ox=f(ox,W,rw);oy=f(oy,H,rh);cX=(rw/2-ox)/T;cY=(rh/2-oy)/T
}
function setCam(x,y){const r=cv.parentNode.getBoundingClientRect();ox=r.width/2-x*T;oy=r.height/2-y*T;clampCam()}
function zoomAt(sx,sy,f){const wx=(sx-ox)/T,wy=(sy-oy)/T;zm=Math.max(1,Math.min(zm*f,Math.max(1,48/(T0||1))));T=(T0||1)*zm;ox=sx-wx*T;oy=sy-wy*T;clampCam()}
function focus(x,y,wide){const r=cv.parentNode.getBoundingClientRect();zm=Math.max(1,Math.min(Math.max(1,48/(T0||1)),r.width/wide/(T0||1)));T=(T0||1)*zm;setCam(x+.5,y+.5)}
function focusStart(){const c=caps[mySeat()];if(!c)return;if(W*H>4000)focus(c.x,c.y,60);else{zm=1;setCam(W/2,H/2)}}
function resize(){
 const r=cv.parentNode.getBoundingClientRect();dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
 T0=Math.min(r.width/W,r.height/H);T=T0*zm;setCam(cX||W/2,cY||H/2)

function paintBg(){
 try{const c=$('#mbg'),g=c.getContext('2d'),w=LW.W,h=LW.H,b=atob(LW.d),n=w*h,id=new Uint8Array(n);let p=0,k=0;
  while(p<b.length&&k<n){const v=b.charCodeAt(p++);let cn=0,sh=0,x;do{x=b.charCodeAt(p++);cn|=(x&127)<<sh;sh+=7}while(x&128);for(let j=0;j<cn&&k<n;j++)id[k++]=v}
  const S=4,gr=g.createLinearGradient(0,0,0,h*S);gr.addColorStop(0,'#0e2a4a');gr.addColorStop(.5,'#0b2038');gr.addColorStop(1,'#071526');g.fillStyle=gr;g.fillRect(0,0,w*S,h*S);

   const a=e?.95:.72;g.fillStyle='rgba('+c0+','+a+')';g.fillRect(x*S,y*S,S,S);

  [[.58,.42,'#e0b422'],[.62,.36,'#c8453b'],[.2,.3,'#3d72c9'],[.82,.5,'#e0b422'],[.45,.6,'#c8453b'],[.34,.28,'#3d72c9']].forEach(q=>{const x=q[0]*w*S,y=q[1]*h*S,r=g.createRadialGradient(x,y,0,x,y,70);r.addColorStop(0,q[2]+'aa');r.addColorStop(1,q[2]+'00');g.fillStyle=r;g.fillRect(x-70,y-70,140,140)});
